// ═════ HELPERS ═════
function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function minClass(score) { return score === null ? "min-na" : "min-" + score; }
function minLabel(score) { return score === null ? "N/A" : score + " \u2014 " + LEVEL_LABELS[String(score)]; }
function getNextLevel(currentLevel) {
  const idx = LEVEL_ORDER.indexOf(currentLevel);
  return idx < LEVEL_ORDER.length - 1 ? LEVEL_ORDER[idx + 1] : null;
}
function getAllComps(area, level) {
  const items = [];
  for (const [code, mins] of Object.entries(CORE_MINS)) items.push({ code, min: mins[level], cluster: "core" });
  for (const [code, mins] of Object.entries(AREA_COMPS[area].comps)) items.push({ code, min: mins[level], cluster: "functional" });
  return items;
}
function getGapInfo(code, minScore) {
  if (minScore === null) return null;
  const myScore = selfScores[code];
  if (myScore === undefined) return null;
  const diff = myScore - minScore;
  if (diff >= 1) return { label: "Above target", cls: "gap-above", diff };
  if (diff === 0) return { label: "At target", cls: "gap-at", diff };
  if (diff === -1) return { label: "1 below target", cls: "gap-below-1", diff };
  return { label: Math.abs(diff) + " below target", cls: "gap-below-2", diff };
}

// ═════ RADAR CHART ═════
function renderRadar(area, level) {
  var items = getAllComps(area, level).filter(function(i){ return i.min !== null; });
  var hasScores = items.some(function(i){ return selfScores[i.code] !== undefined; });
  var hasSupScores = managerMode && items.some(function(i){ return supScores[i.code] !== undefined; });
  if (!hasScores && !hasSupScores) return "";

  var n = items.length;
  var cx = 200, cy = 200, maxR = 160, minR = 30;
  // Scale: 0 maps to minR (inner ring), 3 maps to maxR (outer ring)
  // This ensures score=0 ("Developing") is still visible, not collapsed to center

  function polarToXY(idx, val) {
    var angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
    var r = minR + (val / 3) * (maxR - minR);
    return [cx + r * Math.cos(angle), cy + r * Math.sin(angle)];
  }

  // Grid rings — one per score level (0, 1, 2, 3)
  var gridHTML = "";
  for (var ring = 0; ring <= 3; ring++) {
    var pts = [];
    for (var i = 0; i < n; i++) pts.push(polarToXY(i, ring).join(","));
    gridHTML += '<polygon points="' + pts.join(" ") + '" fill="none" stroke="' + (ring === 0 ? '#ccc' : '#ddd') + '" stroke-width="' + (ring === 0 ? '0.6' : '0.8') + '"/>';
    // Ring label
    var labelPt = polarToXY(0, ring);
    gridHTML += '<text x="' + (labelPt[0] + 4) + '" y="' + (labelPt[1] - 4) + '" font-size="8" fill="#aaa">' + ring + '</text>';
  }

  // Axis lines + labels
  var axisHTML = "";
  for (var i = 0; i < n; i++) {
    var p = polarToXY(i, 3);
    axisHTML += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '" stroke="#eee" stroke-width="0.5"/>';
    var lp = polarToXY(i, 3.45);
    var anchor = lp[0] < cx - 10 ? "end" : (lp[0] > cx + 10 ? "start" : "middle");
    var shortName = items[i].code;
    axisHTML += '<text x="' + lp[0] + '" y="' + lp[1] + '" text-anchor="' + anchor + '" font-size="9" fill="#888" dominant-baseline="central">' + shortName + '</text>';
  }

  // Target polygon
  var targetPts = [];
  for (var i = 0; i < n; i++) targetPts.push(polarToXY(i, items[i].min).join(","));
  var targetPoly = '<polygon points="' + targetPts.join(" ") + '" fill="rgba(0,75,92,0.08)" stroke="#004B5C" stroke-width="1.5" stroke-dasharray="4,3"/>';

  // Self-score polygon
  var selfPoly = "";
  if (hasScores) {
    var selfPts = [];
    for (var i = 0; i < n; i++) {
      var v = selfScores[items[i].code];
      selfPts.push(polarToXY(i, v !== undefined ? Math.max(0, v) : 0).join(","));
    }
    selfPoly = '<polygon points="' + selfPts.join(" ") + '" fill="rgba(255,180,50,0.15)" stroke="#FFB432" stroke-width="2"/>';
    // Dots for scored items
    for (var i = 0; i < n; i++) {
      var v = selfScores[items[i].code];
      if (v !== undefined) {
        var dp = polarToXY(i, Math.max(0, v));
        selfPoly += '<circle cx="' + dp[0] + '" cy="' + dp[1] + '" r="3.5" fill="#FFB432" stroke="#fff" stroke-width="1"/>';
      }
    }
  }

  // Supervisor polygon
  var supPoly = "";
  if (hasSupScores) {
    var supPts = [];
    for (var i = 0; i < n; i++) {
      var v = supScores[items[i].code];
      supPts.push(polarToXY(i, v !== undefined ? Math.max(0, v) : 0).join(","));
    }
    supPoly = '<polygon points="' + supPts.join(" ") + '" fill="rgba(115,10,45,0.08)" stroke="#730A2D" stroke-width="1.5"/>';
    for (var i = 0; i < n; i++) {
      var v = supScores[items[i].code];
      if (v !== undefined) {
        var dp = polarToXY(i, Math.max(0, v));
        supPoly += '<circle cx="' + dp[0] + '" cy="' + dp[1] + '" r="3" fill="#730A2D" stroke="#fff" stroke-width="1"/>';
      }
    }
  }

  var svg = '<svg viewBox="0 0 400 400" style="max-width:380px;width:100%;margin:0 auto;display:block">' + gridHTML + axisHTML + targetPoly + selfPoly + supPoly + '</svg>';

  var legend = '<div class="radar-legend"><span><span class="dot" style="background:#004B5C;opacity:0.4"></span> Target (dashed)</span><span><span class="dot" style="background:#FFB432"></span> Self-score</span>';
  if (hasSupScores) legend += '<span><span class="dot" style="background:#730A2D"></span> Supervisor</span>';
  legend += '</div>';

  return '<div class="radar-wrap"><div class="radar-title">Competency Radar</div>' + svg + legend + '</div>';
}

// ═════ RENDER CARD ═════
function renderCard(code, minScore, level) {
  const c = COMPS[code];
  if (!c) return "";
  const levelKeys = Object.keys(c.levels).sort((a,b) => Number(a) - Number(b));
  const myScore = selfScores[code];
  const mySup = supScores[code];
  const gap = getGapInfo(code, minScore);
  const hasGap = gap && gap.diff < 0;
  const nextLvl = showNextLevel ? getNextLevel(level) : null;

  let levelsHTML = "";
  for (const lk of levelKeys) {
    const lv = c.levels[lk];
    const isTarget = minScore !== null && String(lk) === String(minScore);
    const isCurrent = myScore !== undefined && String(lk) === String(myScore);
    const isSup = managerMode && mySup !== undefined && String(lk) === String(mySup);
    const numLk = Number(lk); const numMin = minScore !== null ? Number(minScore) : null;
    let tagHTML = "";
    if (isCurrent && assessMode) tagHTML += '<span class="level-tag tag-current">Your score</span>';
    if (isSup && managerMode) tagHTML += '<span class="level-tag tag-supervisor">Supervisor</span>';
    if (isTarget) tagHTML += '<span class="level-tag tag-target">Target</span>';
    else if (numMin !== null && numLk > numMin) tagHTML += '<span class="level-tag tag-above">Above target</span>';
    else if (numMin !== null && numLk < numMin) tagHTML += '<span class="level-tag tag-below">Below target</span>';
    const shouldExpand = isTarget || (isCurrent && assessMode) || (isSup && managerMode);
    const collapsed = !shouldExpand ? "collapsed" : "";
    let extraCls = isTarget ? "target" : "";
    if (isCurrent && assessMode) extraCls = "current-score";
    if (isSup && managerMode && !isCurrent) extraCls = "sup-score";
    const exList = lv.ex.map(e => "<li>" + esc(e) + "</li>").join("");
    levelsHTML += '<div class="level-section ' + collapsed + ' ' + extraCls + '" onclick="this.classList.toggle(\'collapsed\')"><div class="level-header"><span class="level-badge ' + minClass(Number(lk)) + '">' + lk + '</span><span class="level-title">' + (LEVEL_LABELS[lk] || "Level "+lk) + '</span>' + tagHTML + '</div><div class="level-examples"><div class="guidance">' + esc(lv.g) + '</div>' + (exList ? '<ul>' + exList + '</ul>' : '') + '</div></div>';
  }

  let scoreRowHTML = "";
  if (assessMode && minScore !== null) {
    const possibleScores = levelKeys.map(Number);
    let btns = possibleScores.map(function(s) {
      const sel = myScore === s ? "selected" : "";
      return '<button class="score-btn ' + sel + '" onclick="event.stopPropagation();setScore(\'' + code + '\',' + s + ')">' + s + '</button>';
    }).join("");
    btns += '<button class="score-btn clear-btn" onclick="event.stopPropagation();clearScore(\'' + code + '\')">Clear</button>';
    let gapHTML = "";
    if (gap) gapHTML = '<span class="gap-indicator ' + gap.cls + '">' + gap.label + '</span>';
    scoreRowHTML = '<div class="self-score-row" onclick="event.stopPropagation()"><span class="label">My score:</span><div class="score-btns">' + btns + '</div>' + gapHTML + '</div>';
  }

  // Supervisor score row
  let supRowHTML = "";
  if (managerMode && minScore !== null) {
    const possibleScores = levelKeys.map(Number);
    let btns = possibleScores.map(function(s) {
      const sel = mySup === s ? "sup-selected" : "";
      return '<button class="score-btn sup-btn ' + sel + '" onclick="event.stopPropagation();setSupScore(\'' + code + '\',' + s + ')">' + s + '</button>';
    }).join("");
    btns += '<button class="score-btn clear-btn" onclick="event.stopPropagation();clearSupScore(\'' + code + '\')">Clear</button>';
    let supGapHTML = "";
    if (mySup !== undefined && minScore !== null) {
      var sd = mySup - minScore;
      var sl = sd >= 1 ? "Above target" : sd === 0 ? "At target" : sd === -1 ? "1 below" : Math.abs(sd) + " below";
      var sc = sd >= 1 ? "gap-above" : sd === 0 ? "gap-at" : sd === -1 ? "gap-below-1" : "gap-below-2";
      supGapHTML = '<span class="gap-indicator ' + sc + '">' + sl + '</span>';
    }
    supRowHTML = '<div class="sup-score-row" onclick="event.stopPropagation()"><span class="label">Supervisor score:</span><div class="score-btns">' + btns + '</div>' + supGapHTML + '</div>';
  }

  let nextLevelHTML = "";
  if (nextLvl && minScore !== null) {
    var nextMin = null;
    if (CORE_MINS[code]) nextMin = CORE_MINS[code][nextLvl];
    else { var area = document.getElementById("area").value; var ac = AREA_COMPS[area]?.comps; if (ac && ac[code]) nextMin = ac[code][nextLvl]; }
    if (nextMin !== null && nextMin !== undefined && nextMin > minScore) {
      nextLevelHTML = '<div style="font-size:0.78rem;color:#730A2D;margin-top:6px;padding:6px 10px;background:#fdf2f5;border-radius:6px;">For <strong>' + LEVEL_NAMES[nextLvl] + '</strong>: target increases to <strong>' + nextMin + ' \u2014 ' + LEVEL_LABELS[String(nextMin)] + '</strong></div>';
    }
  }

  return '<div class="comp-card ' + (hasGap ? 'gap-highlight' : '') + '" onclick="this.classList.toggle(\'open\')"><div class="comp-head"><span class="comp-code">' + code + '</span><span class="comp-name">' + esc(c.name) + '</span><span class="comp-min ' + minClass(minScore) + '">' + minLabel(minScore) + '</span><span class="chevron"><svg viewBox="0 0 18 11" fill="none" stroke="#004B5C" stroke-width="2"><path d="M1 1l8 8 8-8"/></svg></span></div><div class="comp-body" onclick="event.stopPropagation()"><div class="comp-def">' + esc(c.def) + '</div>' + (c.hasNeg ? '<div class="integrity-note">Note: Integrity is the only competency that uses the -1 (Below Expectations) level. A score of -1 indicates behavior that violates PI + YPI\u2019s ethical principles and requires immediate corrective action.</div>' : '') + scoreRowHTML + supRowHTML + nextLevelHTML + levelsHTML + '</div></div>';
}

// ═════ SCORING ═════
function setScore(code, score) { selfScores[code] = score; saveState(); render(); }
function clearScore(code) { delete selfScores[code]; saveState(); render(); }
function setSupScore(code, score) { supScores[code] = score; saveState(); render(); }
function clearSupScore(code) { delete supScores[code]; saveState(); render(); }
function resetAllScores() { selfScores = {}; supScores = {}; saveState(); render(); }
function toggleAllCards() {
  allExpanded = !allExpanded;
  document.querySelectorAll('.comp-card').forEach(function(card) {
    if (allExpanded) card.classList.add('open');
    else card.classList.remove('open');
  });
}
function filterComps() {
  searchQuery = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase().trim() : "";
  document.querySelectorAll('.comp-card').forEach(function(card) {
    var name = card.querySelector('.comp-name');
    var code = card.querySelector('.comp-code');
    var text = (name ? name.textContent : '') + ' ' + (code ? code.textContent : '');
    if (searchQuery && text.toLowerCase().indexOf(searchQuery) === -1) card.classList.add('search-hidden');
    else card.classList.remove('search-hidden');
  });
}

// ═════ DASHBOARD ═════
function renderDashboard(area, level) {
  const items = getAllComps(area, level).filter(function(i) { return i.min !== null; });
  const scored = items.filter(function(i) { return selfScores[i.code] !== undefined; });
  if (scored.length === 0) return '<div class="dashboard active"><div class="dash-title">Self-Assessment Dashboard</div><div class="dash-hint">Score your competencies below to see your gap analysis here.</div></div>';
  var met = 0, below1 = 0, below2 = 0, gaps = [];
  for (var i = 0; i < scored.length; i++) {
    var diff = selfScores[scored[i].code] - scored[i].min;
    if (diff >= 0) met++;
    else if (diff === -1) { below1++; gaps.push({ code: scored[i].code, gap: Math.abs(diff) }); }
    else { below2++; gaps.push({ code: scored[i].code, gap: Math.abs(diff) }); }
  }
  var unscored = items.length - scored.length;
  var pct = Math.round((met / items.length) * 100);
  gaps.sort(function(a,b) { return b.gap - a.gap; });
  var prioritiesHTML = "";
  if (gaps.length > 0) {
    var topGaps = gaps.slice(0, 5);
    var pItems = topGaps.map(function(g) { var c = COMPS[g.code]; return '<div class="priority-item"><span class="priority-gap ' + (g.gap >= 2 ? 'gap-2' : '') + '">' + g.gap + ' level' + (g.gap>1?'s':'') + ' below</span> <span>' + g.code + ' ' + esc(c.name) + '</span></div>'; }).join("");
    prioritiesHTML = '<div class="dash-priorities"><h4>Top Development Priorities</h4>' + pItems + '</div>';
  }
  return '<div class="dashboard active"><div class="dash-title">Self-Assessment Dashboard</div><div class="dash-stats"><div class="dash-stat stat-met"><div class="num">' + met + '</div><div class="lbl">At/Above Target</div></div><div class="dash-stat stat-below"><div class="num">' + below1 + '</div><div class="lbl">1 Below</div></div><div class="dash-stat stat-far"><div class="num">' + below2 + '</div><div class="lbl">2+ Below</div></div><div class="dash-stat stat-unscored"><div class="num">' + unscored + '</div><div class="lbl">Not Scored</div></div></div><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div><div class="dash-hint">' + met + ' of ' + items.length + ' assessed competencies at or above target (' + pct + '%)</div>' + prioritiesHTML + '</div>';
}

// ═════ PERSISTENCE BAR ═════
function renderPersistBar() {
  var snapHTML = "";
  if (snapshots.length > 0) {
    snapHTML = '<div class="snapshot-list">';
    for (var i = 0; i < snapshots.length; i++) {
      snapHTML += '<div class="snapshot-item"><span class="snap-name">' + esc(snapshots[i].name) + '</span><span class="snap-date">' + snapshots[i].date + '</span><button class="snap-btn" onclick="loadSnapshot(' + i + ')">Load</button><button class="snap-btn snap-del" onclick="deleteSnapshot(' + i + ')">Delete</button></div>';
    }
    snapHTML += '</div>';
  }
  return '<div class="persist-bar"><div class="persist-title">Saved Data <span id="saveStatus" class="save-status">Auto-saved</span></div><div class="persist-row"><button class="btn btn-secondary" onclick="saveSnapshot()">Save Snapshot</button><button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button><button class="btn btn-secondary" onclick="exportJSON()">Export JSON</button></div>' + snapHTML + '</div>';
}

// ═════ MANAGER PANEL ═════
function renderManagerPanel() {
  if (!managerMode) return "";
  return '<div class="manager-panel"><div class="mgr-title">Manager View</div><div class="mgr-row"><button class="btn btn-secondary" onclick="document.getElementById(\'mgrImportWrap\').style.display=document.getElementById(\'mgrImportWrap\').style.display===\'block\'?\'none\':\'block\'">Import Staff JSON</button></div><div id="mgrImportWrap" class="mgr-import-area" style="display:none"><textarea id="mgrImportTA" placeholder="Paste a staff member\'s exported JSON here..."></textarea><button class="btn btn-primary" onclick="importJSON()" style="margin-top:6px">Load Data</button></div></div>';
}

// ═════ PRINT PLAN ═════
function generatePlan() {
  var area = document.getElementById("area").value;
  var level = document.getElementById("level").value;
  if (!area || !level) return;
  var areaData = AREA_COMPS[area];
  var items = getAllComps(area, level).filter(function(i) { return i.min !== null; });
  var nextLvl = getNextLevel(level);
  var rows = "", gaps = [];
  var hasSup = managerMode && Object.keys(supScores).length > 0;
  var supHeader = hasSup ? '<th>Sup. Score</th><th>Sup. Gap</th>' : '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i], c = COMPS[item.code];
    var myScore = selfScores[item.code];
    var scoreStr = myScore !== undefined ? String(myScore) : "\u2014";
    var diff = myScore !== undefined ? myScore - item.min : null;
    var gapStr = "\u2014", gapCls = "";
    if (diff !== null) {
      if (diff >= 0) { gapStr = diff === 0 ? "At target" : "+" + diff; gapCls = diff === 0 ? "gap-zero" : "gap-pos"; }
      else { gapStr = String(diff); gapCls = "gap-neg"; gaps.push({ code: item.code, name: c.name, gap: Math.abs(diff), min: item.min }); }
    }
    var supCells = "";
    if (hasSup) {
      var ss = supScores[item.code];
      var ssStr = ss !== undefined ? String(ss) : "\u2014";
      var sd = ss !== undefined ? ss - item.min : null;
      var sgStr = "\u2014", sgCls = "";
      if (sd !== null) {
        if (sd >= 0) { sgStr = sd === 0 ? "At target" : "+" + sd; sgCls = sd === 0 ? "gap-zero" : "gap-pos"; }
        else { sgStr = String(sd); sgCls = "gap-neg"; }
      }
      supCells = '<td>' + ssStr + '</td><td class="gap-cell ' + sgCls + '">' + sgStr + '</td>';
    }
    rows += '<tr><td>' + item.code + '</td><td>' + esc(c.name) + '</td><td>' + item.min + '</td><td>' + scoreStr + '</td><td class="gap-cell ' + gapCls + '">' + gapStr + '</td>' + supCells + '</tr>';
  }
  gaps.sort(function(a,b) { return b.gap - a.gap; });
  var devPlan = "";
  if (gaps.length > 0) {
    var planRows = gaps.slice(0, 5).map(function(g, i) {
      var c = COMPS[g.code];
      var nextScore = selfScores[g.code] + 1;
      var targetLvl = c.levels[String(nextScore)];
      var nextStep = targetLvl ? esc(targetLvl.g) : "See competency details";
      return '<tr><td>' + (i+1) + '</td><td>' + g.code + ' ' + esc(g.name) + '</td><td>' + g.gap + ' level' + (g.gap>1?'s':'') + '</td><td style="font-size:0.78rem">' + nextStep + '</td></tr>';
    }).join("");
    devPlan = '<div class="print-section"><h3>Development Plan \u2014 Top Priorities</h3><table class="print-table"><thead><tr><th>#</th><th>Competency</th><th>Gap</th><th>Next Step</th></tr></thead><tbody>' + planRows + '</tbody></table></div>';
  }
  var nextLevelSection = "";
  if (nextLvl) {
    var increases = [];
    for (var j = 0; j < items.length; j++) {
      var it = items[j]; var nMin = null;
      if (CORE_MINS[it.code]) nMin = CORE_MINS[it.code][nextLvl];
      else if (areaData.comps[it.code]) nMin = areaData.comps[it.code][nextLvl];
      if (nMin !== null && nMin !== undefined && nMin > it.min) increases.push({ code: it.code, name: COMPS[it.code].name, from: it.min, to: nMin });
    }
    if (increases.length > 0) {
      var incRows = increases.map(function(inc) { return '<tr><td>' + inc.code + ' ' + esc(inc.name) + '</td><td>' + inc.from + ' \u2192 ' + inc.to + '</td></tr>'; }).join("");
      nextLevelSection = '<div class="print-section"><h3>Path to ' + LEVEL_NAMES[nextLvl] + '</h3><p style="font-size:0.85rem;margin-bottom:10px;color:#555">' + increases.length + ' competencies increase in target score for ' + LEVEL_NAMES[nextLvl] + ' level.</p><table class="print-table"><thead><tr><th>Competency</th><th>Target Change</th></tr></thead><tbody>' + incRows + '</tbody></table></div>';
    }
  }
  var today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  var staffName = document.getElementById("staffName") ? document.getElementById("staffName").value.trim() : "";
  var nameDisplay = staffName ? '<div style="font-size:1.05rem;font-weight:600;color:#1a1a1a;margin-bottom:2px">' + esc(staffName) + '</div>' : '';
  var scoredCount = items.filter(function(it) { return selfScores[it.code] !== undefined; }).length;
  document.getElementById("printContent").innerHTML = '<button class="print-close" onclick="closePlan()">\u00d7</button><h2>PI + YPI Development Plan</h2>' + nameDisplay + '<div class="subtitle">' + areaData.label + ' \u2014 ' + LEVEL_NAMES[level] + ' &nbsp;|&nbsp; Generated ' + today + '</div><div class="print-section"><h3>Competency Scores (' + scoredCount + ' of ' + items.length + ' scored)</h3><table class="print-table"><thead><tr><th>Code</th><th>Competency</th><th>Target</th><th>My Score</th><th>Gap</th>' + supHeader + '</tr></thead><tbody>' + rows + '</tbody></table></div>' + devPlan + nextLevelSection + '<div class="print-actions"><button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button><button class="btn btn-secondary" onclick="closePlan()">Close</button></div>';
  document.getElementById("printOverlay").classList.add("active");
}
function closePlan() { document.getElementById("printOverlay").classList.remove("active"); }

// ═════ MAIN RENDER ═════
function render() {
  var area = document.getElementById("area").value;
  var level = document.getElementById("level").value;
  var app = document.getElementById("app");
  if (!area || !level) { app.innerHTML = '<div class="empty-state"><p>Select your role area and level above to see your competency profile.</p></div>'; return; }
  var areaData = AREA_COMPS[area];
  var funcComps = Object.entries(areaData.comps).filter(function(e) { return e[1][level] !== null; });
  var funcNA = Object.entries(areaData.comps).filter(function(e) { return e[1][level] === null; });
  var totalCore = Object.keys(CORE_MINS).length;
  var totalFunc = funcComps.length;
  var nextLvl = getNextLevel(level);

  var actionHTML = '<div class="action-row"><button class="btn ' + (assessMode ? 'btn-primary active' : 'btn-secondary') + '" onclick="assessMode=!assessMode;saveState();render()">' + (assessMode ? 'Exit Self-Assessment' : 'Start Self-Assessment') + '</button>';
  actionHTML += '<button class="btn ' + (managerMode ? 'btn-primary active' : 'btn-secondary') + '" style="' + (managerMode ? 'background:#730A2D' : '') + '" onclick="managerMode=!managerMode;saveState();render()">' + (managerMode ? 'Exit Manager View' : 'Manager View') + '</button>';
  if (nextLvl) actionHTML += '<button class="btn ' + (showNextLevel ? 'btn-primary active' : 'btn-secondary') + '" onclick="showNextLevel=!showNextLevel;render()">' + (showNextLevel ? 'Hide Next Level' : 'Compare: ' + LEVEL_NAMES[nextLvl]) + '</button>';
  if ((assessMode || managerMode) && (Object.keys(selfScores).length > 0 || Object.keys(supScores).length > 0)) {
    actionHTML += '<button class="btn btn-accent" onclick="generatePlan()">View Development Plan</button>';
    actionHTML += '<button class="btn btn-secondary" onclick="if(confirm(\'Reset all scores? This cannot be undone.\')){resetAllScores()}" style="color:#a82828;border-color:#a82828">Reset All Scores</button>';
  }
  actionHTML += '<button class="btn btn-secondary" onclick="toggleAllCards()" style="margin-left:auto">' + (allExpanded ? 'Collapse All' : 'Expand All') + '</button>';
  actionHTML += '</div>';

  var nextInfoHTML = "";
  if (showNextLevel && nextLvl) nextInfoHTML = '<div class="next-level-info" style="display:block">Showing what changes if you move to <strong>' + LEVEL_NAMES[nextLvl] + '</strong>. Look for the burgundy notes inside each competency card.</div>';

  var dashHTML = assessMode ? renderDashboard(area, level) : "";
  var radarHTML = (assessMode || managerMode) ? renderRadar(area, level) : "";
  var persistHTML = (assessMode || managerMode) ? renderPersistBar() : "";
  var mgrHTML = renderManagerPanel();

  var searchHTML = '<div class="search-box"><span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span><input type="text" id="searchInput" class="search-input" placeholder="Search competencies by name or code\u2026" oninput="filterComps()" value="' + esc(searchQuery) + '"></div>';

  var html = '<div class="summary-bar"><span class="badge">' + areaData.label + '</span><span class="badge">' + LEVEL_NAMES[level] + '</span><span class="info">' + totalCore + ' core + ' + totalFunc + ' functional competencies apply to you</span></div>' + actionHTML + dashHTML + radarHTML + mgrHTML + persistHTML + nextInfoHTML + '<details class="rating-ref"><summary>Rating scale reference</summary><div class="scale"><span><strong>0</strong> Developing</span><span><strong>1</strong> Foundational</span><span><strong>2</strong> Proficient</span><span><strong>3</strong> Advanced</span></div></details>' + searchHTML + '<div class="section-label">Core Competencies \u2014 Required of All Staff</div>';

  for (var code in CORE_MINS) html += renderCard(code, CORE_MINS[code][level], level);
  html += '<div class="section-label">Functional Competencies \u2014 ' + areaData.label + '</div>';
  for (var i = 0; i < funcComps.length; i++) html += renderCard(funcComps[i][0], funcComps[i][1][level], level);
  if (funcNA.length > 0) {
    html += '<div class="section-label" style="opacity:0.5">Not assessed at ' + LEVEL_NAMES[level] + ' level</div>';
    for (var j = 0; j < funcNA.length; j++) html += renderCard(funcNA[j][0], null, level);
  }
  app.innerHTML = html;
  if (searchQuery) filterComps();
  if (allExpanded) document.querySelectorAll('.comp-card').forEach(function(c) { c.classList.add('open'); });
}

// ═════ INIT ═════
loadState();
render();

document.getElementById("area").addEventListener("change", function() { allExpanded = false; searchQuery = ""; saveState(); render(); });
document.getElementById("level").addEventListener("change", function() { allExpanded = false; searchQuery = ""; saveState(); render(); });
document.getElementById("staffName").addEventListener("input", function() { saveState(); });
</script>
</body>
